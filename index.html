<main id="app">
  <section id="challenge" aria-labelledby="challenge-title">
    <h1 id="challenge-title">Today's challenge</h1>
    <p id="challenge-prompt"></p>
    <button id="complete-challenge">Complete challenge</button>
    <p id="reward-status" role="status"></p>
  </section>
  <section aria-labelledby="coach-title">
    <h2 id="coach-title">Quest Coach</h2>
    <label for="coach-question">Ask for a hint</label>
    <input id="coach-question" maxlength="300">
    <button id="ask-coach" type="button">Get hint</button>
    <p id="coach-status" role="status"></p>
  </section>
</main>
